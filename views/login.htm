<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – IT Tech Club</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .badge { text-align:center; font-size:11px; color:#7c7caa; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; }
    h1 { font-size:22px; font-weight:700; color:#fff; text-align:center; margin-bottom:28px; }

    .tabs {
      display: flex;
      background: #12122a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1; text-align:center; padding: 9px;
      border-radius: 8px; font-size:14px; font-weight:600;
      cursor: pointer; color: #6060a0; border: none; background: none;
      transition: all 0.2s;
    }

    .tab.active { background: linear-gradient(135deg,#7b61ff,#5e43d8); color:#fff; }

    label { display:block; font-size:13px; color:#9090b0; margin-bottom:6px; margin-top:16px; }

    input {
      width:100%; padding:11px 14px; border-radius:8px;
      border:1px solid #2e2e50; background:#12122a;
      color:#e0e0e0; font-size:15px; outline:none; transition:border 0.2s;
    }

    input:focus { border-color:#7b61ff; }
    input::placeholder { color:#44446a; }

    .btn-primary {
      margin-top:22px; width:100%; padding:13px;
      background:linear-gradient(135deg,#7b61ff,#5e43d8);
      color:#fff; font-size:16px; font-weight:600;
      border:none; border-radius:10px; cursor:pointer;
      transition:opacity 0.2s, transform 0.1s;
    }

    .btn-primary:hover { opacity:0.9; }
    .btn-primary:active { transform:scale(0.98); }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }

    #message { margin-top:14px; padding:11px 14px; border-radius:8px; font-size:13px; text-align:center; display:none; }
    #message.success { background:#0d3321; border:1px solid #1a6640; color:#4ade80; display:block; }
    #message.error   { background:#330d0d; border:1px solid #661a1a; color:#f87171; display:block; }

    .home-link { display:block; text-align:center; margin-top:18px; color:#7c7caa; font-size:13px; text-decoration:none; }
    .home-link:hover { color:#7b61ff; }
  </style>
</head>
<body>
<div class="card">
  <div class="badge">IT Tech Club</div>
  <h1>Welcome Back</h1>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Log In</button>
    <button class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <!-- LOGIN FORM -->
  <div id="form-login">
    <label>Email Address</label>
    <input type="email" id="login-email" placeholder="you@example.com"/>
    <label>Password</label>
    <input type="password" id="login-password" placeholder="••••••••"/>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Log In</button>
  </div>

  <!-- SIGNUP FORM -->
  <div id="form-signup" style="display:none">
    <label>Full Name</label>
    <input type="text" id="signup-name" placeholder="e.g. Dhiraj Sharma"/>
    <label>Email Address</label>
    <input type="email" id="signup-email" placeholder="you@example.com"/>
    <label>Password</label>
    <input type="password" id="signup-password" placeholder="Min 6 characters"/>
    <button class="btn-primary" id="signup-btn" onclick="doSignup()">Create Account</button>
  </div>

  <div id="message"></div>
  <a class="home-link" href="/">← Back to Home</a>
</div>

<script>
  /* Redirect target after login */
  const redirect = new URLSearchParams(window.location.search).get("redirect") || "/";

  function switchTab(tab) {
    const isLogin = tab === "login";
    document.getElementById("form-login").style.display  = isLogin ? "block" : "none";
    document.getElementById("form-signup").style.display = isLogin ? "none"  : "block";
    document.getElementById("tab-login").classList.toggle("active",  isLogin);
    document.getElementById("tab-signup").classList.toggle("active", !isLogin);
    clearMessage();
  }

  async function doLogin() {
    const email    = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const btn      = document.getElementById("login-btn");

    if (!email || !password) { showMessage("Please fill in all fields.", "error"); return; }

    btn.disabled = true; btn.textContent = "Logging in…";

    try {
      const res  = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (data.success) {
        showMessage(data.message, "success");
        setTimeout(() => window.location.href = redirect, 800);
      } else {
        showMessage(data.message, "error");
        btn.disabled = false; btn.textContent = "Log In";
      }
    } catch {
      showMessage("Network error. Please try again.", "error");
      btn.disabled = false; btn.textContent = "Log In";
    }
  }

  async function doSignup() {
    const name     = document.getElementById("signup-name").value.trim();
    const email    = document.getElementById("signup-email").value.trim();
    const password = document.getElementById("signup-password").value;
    const btn      = document.getElementById("signup-btn");

    if (!name || !email || !password) { showMessage("Please fill in all fields.", "error"); return; }
    if (password.length < 6) { showMessage("Password must be at least 6 characters.", "error"); return; }

    btn.disabled = true; btn.textContent = "Creating account…";

    try {
      const res  = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      if (data.success) {
        showMessage(data.message + " Switching to login…", "success");
        setTimeout(() => { switchTab("login"); clearMessage(); }, 1500);
      } else {
        showMessage(data.message, "error");
      }
      btn.disabled = false; btn.textContent = "Create Account";
    } catch {
      showMessage("Network error. Please try again.", "error");
      btn.disabled = false; btn.textContent = "Create Account";
    }
  }

  function showMessage(text, type) {
    const el = document.getElementById("message");
    el.textContent = text; el.className = type;
  }

  function clearMessage() {
    const el = document.getElementById("message");
    el.textContent = ""; el.className = "";  el.style.display = "none";
  }

  /* Allow Enter key to submit */
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const loginVisible = document.getElementById("form-login").style.display !== "none";
    if (loginVisible) doLogin(); else doSignup();
  });
</script>
</body>
</html>
